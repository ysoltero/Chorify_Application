<h2 class="mb-3">My Household</h2>
<div id="householdMessage" class="mb-3" role="status"></div>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <h5>Create a household</h5>
        <form id="createHouseholdForm" class="d-flex gap-2">
            <input id="householdName" class="form-control" placeholder="Household name" required>
            <button class="btn btn-primary" type="submit">Create</button>
        </form>
    </div>
</div>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        <label for="householdSelect" class="form-label">Current household</label>
        <select id="householdSelect" class="form-select mb-3"></select>
        <h3 id="currentHouseholdName"></h3>
        <p id="memberCount" class="text-secondary"></p>
        <p id="currentUsername"></p>
        <h5>Members</h5>
        <ul id="memberList" class="list-group mb-3"></ul>

        <form id="addMemberForm" class="d-flex gap-2 mb-3">
            <input id="memberUsername" class="form-control" placeholder="Username to add" required>
            <button class="btn btn-primary" type="submit">Add member</button>
        </form>

        <button id="leaveHouseholdBtn" class="btn btn-outline-danger">
            Leave household
        </button>
    </div>

</div>
</div>
<!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>
let currentUser = null;
let households = [];
let selectedHousehold = null;

const message = document.getElementById('householdMessage');

function showMessage(text, error = false) {
    message.textContent = text;
    message.className = error ? 'alert alert-danger' : 'alert alert-success';
}

async function api(url, options = {}) {
    const response = await fetch(url, {
        credentials: 'same-origin',
        ...options,
        headers: {'Content-Type': 'application/json', ...options.headers}
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'Request failed');
    return data;
}

async function loadHouseholds(preferredId = null) {
    const data = await api('/households?username=' + encodeURIComponent(currentUser));
    households = data.households;

    const select = document.getElementById('householdSelect');
    select.replaceChildren();

    households.forEach(house => {
        const option = document.createElement('option');
        option.value = house.household_id;
        option.textContent = house.household_name;
        select.appendChild(option);
    });

    const savedId = preferredId || Number(localStorage.getItem('chorifyHouseholdId'));
    selectedHousehold = households.find(h => h.household_id === savedId) || households[0] || null;

    if (selectedHousehold) {
        select.value = selectedHousehold.household_id;
        localStorage.setItem('chorifyHouseholdId', selectedHousehold.household_id);
    } else {
        localStorage.removeItem('chorifyHouseholdId');
    }

    await loadMembers();
}

async function loadMembers() {
    const name = document.getElementById('currentHouseholdName');
    const count = document.getElementById('memberCount');
    const list = document.getElementById('memberList');
    const addForm = document.getElementById('addMemberForm');
    const leaveBtn = document.getElementById('leaveHouseholdBtn');

    list.replaceChildren();
    name.textContent = selectedHousehold ? selectedHousehold.household_name : 'No household selected';
    count.textContent = '';

    if (!selectedHousehold) {
        addForm.hidden = true;
        leaveBtn.hidden = true;
        return;
    }

    const creator = selectedHousehold.created_by === currentUser;
    addForm.hidden = !creator;
    leaveBtn.hidden = creator;

    const data = await api('/households/' + selectedHousehold.household_id + '/members');
    count.textContent = data.members.length + ' members';

    data.members.forEach(member => {
        const item = document.createElement('li');
        item.className = 'list-group-item d-flex justify-content-between align-items-center';

        const label = document.createElement('span');
        label.textContent = member.username + (member.username === selectedHousehold.created_by ? ' (creator)' : '');
        item.appendChild(label);

        if (creator && member.username !== currentUser) {
            const remove = document.createElement('button');
            remove.className = 'btn btn-outline-danger btn-sm';
            remove.textContent = 'Remove';
            remove.addEventListener('click', async () => {
                if (!confirm('Remove ' + member.username + ' from this household?')) return;
                try {
                    await api('/households/' + selectedHousehold.household_id + '/members/' +
                        encodeURIComponent(member.username), {method: 'DELETE'});
                    showMessage('Member removed');
                    await loadMembers();
                } catch (err) {
                    showMessage(err.message, true);
                }
            });
            item.appendChild(remove);
        }

        list.appendChild(item);
    });
}

document.getElementById('createHouseholdForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
        const household_name = document.getElementById('householdName').value.trim();
        const data = await api('/households', {
            method: 'POST',
            body: JSON.stringify({household_name, username: currentUser})
        });
        document.getElementById('householdName').value = '';
        showMessage('Household created');
        await loadHouseholds(data.household.household_id);
    } catch (err) {
        showMessage(err.message, true);
    }
});

document.getElementById('householdSelect').addEventListener('change', async e => {
    selectedHousehold = households.find(h => h.household_id === Number(e.target.value));
    localStorage.setItem('chorifyHouseholdId', selectedHousehold.household_id);
    try {
        await loadMembers();
    } catch (err) {
        showMessage(err.message, true);
    }
});

document.getElementById('addMemberForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
        const username = document.getElementById('memberUsername').value.trim();
        await api('/households/' + selectedHousehold.household_id + '/members', {
            method: 'POST',
            body: JSON.stringify({username})
        });
        document.getElementById('memberUsername').value = '';
        showMessage('Member added');
        await loadMembers();
    } catch (err) {
        showMessage(err.message, true);
    }
});

document.getElementById('leaveHouseholdBtn').addEventListener('click', async () => {
    if (!selectedHousehold || !confirm('Leave this household? Your assigned chores in it will be deleted.')) return;
    try {
        await api('/households/' + selectedHousehold.household_id + '/leave', {
            method: 'DELETE',
            body: JSON.stringify({username: currentUser})
        });
        showMessage('You left the household');
        await loadHouseholds();
    } catch (err) {
        showMessage(err.message, true);
    }
});

async function init() {
    try {
        const session = await api('/session');
        currentUser = session.username;
        document.getElementById('currentUsername').textContent = 'Username: ' + currentUser;
        await loadHouseholds();
    } catch (err) {
        showMessage(err.message, true);
        if (err.message === 'Please log in') {
            window.location.href = '/login.html';
        }
    }
}

init();
</script>
