<!--Java Script that -->
<script>
    const allTasksBtn = document.getElementById("allTasksBtn");
    const myTasksBtn = document.getElementById("myTasksBtn");
    const completedBtn = document.getElementById("completedBtn");
    const tasks = document.querySelectorAll(".task-card");
function setActiveButton(activeButton) {
    const buttons = [allTasksBtn, myTasksBtn, completedBtn];

    buttons.forEach(button => {
        button.classList.remove("btn-dark");
        button.classList.add("btn-outline-secondary");
    });

    activeButton.classList.remove("btn-outline-secondary");
    activeButton.classList.add("btn-dark");
}

allTasksBtn.addEventListener("click", function () {
    document.querySelectorAll(".task-card").forEach(task => {
        task.style.display = "block";
    });

    setActiveButton(allTasksBtn);
});

myTasksBtn.addEventListener("click", function () {
    document.querySelectorAll(".task-card").forEach(task => {
        task.style.display =
            task.dataset.assignee === dashboardUsername ? "block" : "none";
    });

    setActiveButton(myTasksBtn);
});

completedBtn.addEventListener("click", function () {
    document.querySelectorAll(".task-card").forEach(task => {
        task.style.display =
            task.querySelector(".complete-checkbox").checked ? "block" : "none";
    });

    setActiveButton(completedBtn);
});

const checkboxes = document.querySelectorAll(".complete-checkbox");

checkboxes.forEach(checkbox => {
    checkbox.addEventListener("change", function () {

        const task = this.closest(".task-card");

        if (this.checked) {
            task.dataset.status = "completed";
        } else {
            task.dataset.status = "todo";
        }

        if (completedBtn.classList.contains("btn-dark")) {
            task.style.display = this.checked ? "block" : "none";
        }
    });
});

// Save new tasks to the database
document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("createTaskForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const household_id = Number(localStorage.getItem("chorifyHouseholdId"));
        if (!household_id) {
            alert("Please select a household first.");
            return;
        }

        const task = {
            name: document.getElementById("taskName").value.trim(),
            assigned_to: document.getElementById("taskAssignee").value,
            due_date: document.getElementById("taskDueDate").value,
            points: Number(document.getElementById("taskPoints").value),
            household_id
        };

        try {
            const response = await fetch("/assigned-chores", {
                method: "POST",
                credentials: "same-origin",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(task)
            });

            const result = await response.json();
            if (!response.ok) {
                alert(result.message || "Could not create task");
                return;
            }

            this.reset();
            bootstrap.Modal.getInstance(
                document.getElementById("createTaskModal")
            ).hide();

            await loadDashboardTasks();
        } catch (err) {
            alert("Could not save task: " + err.message);
        }
    });
});

let dashboardUsername = null;

async function loadDashboardTasks() {
    try {
        const sessionResponse = await fetch("/session");
        if (!sessionResponse.ok) {
            window.location.href = "/login.html";
            return;
        }

        const session = await sessionResponse.json();
        dashboardUsername = session.username;
        const response = await fetch(
            "/my-chores?username=" + encodeURIComponent(session.username)
        );

        if (!response.ok) throw new Error("Could not load tasks");

        const data = await response.json();
        const taskList = document.getElementById("taskList");
        taskList.replaceChildren();

        data.chores.forEach(chore => {
            const card = document.createElement("div");
            card.className = "card mb-3 shadow-sm task-card";
            card.dataset.assignee = chore.assigned_to;
            card.dataset.status = chore.completed ? "completed" : "todo";

            const body = document.createElement("div");
            body.className = "card-body";

            const row = document.createElement("div");
            row.className = "row align-items-center";

            const nameCol = document.createElement("div");
            nameCol.className = "col-md-5";

            const name = document.createElement("h5");
            name.textContent = chore.name;

            const assignee = document.createElement("small");
            assignee.textContent = "Assigned to: " + chore.assigned_to;

            nameCol.append(name, assignee);

            const dueCol = document.createElement("div");
            dueCol.className = "col-md-2";

            const dueLabel = document.createElement("small");
            dueLabel.className = "text-muted";
            dueLabel.textContent = "Due";

            const dueDate = document.createElement("p");
            dueDate.textContent = chore.due_date || "No due date";

            dueCol.append(dueLabel, dueDate);

            const pointsCol = document.createElement("div");
            pointsCol.className = "col-md-2";

            const pointsLabel = document.createElement("small");
            pointsLabel.className = "text-muted";
            pointsLabel.textContent = "Points";

            const points = document.createElement("p");
            points.textContent = chore.points + " points";

            pointsCol.append(pointsLabel, points);

            const statusCol = document.createElement("div");
            statusCol.className = "col-md-2";

            const status = document.createElement("span");
            status.className = chore.completed ?
                "badge bg-success" : "badge bg-warning text-dark";
            status.textContent = chore.completed ? "Completed" : "To do";

            statusCol.appendChild(status);

            const checkboxCol = document.createElement("div");
            checkboxCol.className = "col-md-1 text-end";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "form-check-input complete-checkbox";
            checkbox.checked = chore.completed;
            checkbox.disabled = false;
            checkbox.addEventListener("change", async function() {
                checkbox.disabled = true;

                try {
                    const action = checkbox.checked ? "complete" : "uncomplete";
                    const response = await fetch("/chores/" + chore.id + "/" + action, {
                        method: "PATCH",
                        credentials: "same-origin",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({username: dashboardUsername})
                    });

                    const result = await response.json();
                    if (!response.ok) throw new Error(result.message || "Could not update chore");

                    await loadDashboardTasks();
                } catch (err) {
                    checkbox.checked = !checkbox.checked;
                    alert(err.message);
                } finally {
                    checkbox.disabled = false;
                }
            });

            checkboxCol.appendChild(checkbox);
            row.append(nameCol, dueCol, pointsCol, statusCol, checkboxCol);
            body.appendChild(row);
            card.appendChild(body);
            taskList.appendChild(card);
        });
    } catch (err) {
        console.error(err);
        alert(err.message);
    }
}

document.addEventListener("DOMContentLoaded", loadDashboardTasks);
</script>

<script>
async function loadTaskAssignees() {
    const select = document.getElementById('taskAssignee');
    select.replaceChildren();

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Select a household member';
    select.appendChild(placeholder);

    try {
        const sessionResponse = await fetch('/session');
        if (!sessionResponse.ok) throw new Error('Please log in');

        const session = await sessionResponse.json();
        const householdResponse = await fetch(
            '/households?username=' + encodeURIComponent(session.username)
        );
        if (!householdResponse.ok) throw new Error('Could not load households');

        const householdData = await householdResponse.json();
        const savedId = Number(localStorage.getItem('chorifyHouseholdId'));
        const household = householdData.households.find(
            h => h.household_id === savedId
        );

        if (!household) {
            placeholder.textContent = 'Select a household on the Household page first';
            return;
        }

        const response = await fetch('/households/' + household.household_id + '/members');
        if (!response.ok) throw new Error('Could not load household members');

        const data = await response.json();

        data.members.forEach(member => {
            const option = document.createElement('option');
            option.value = member.username;
            option.textContent = member.username;
            select.appendChild(option);
        });
    } catch (err) {
        console.error(err);
        placeholder.textContent = err.message;
    }
}

document.getElementById('createTaskModal').addEventListener(
    'show.bs.modal', loadTaskAssignees
);
</script>
