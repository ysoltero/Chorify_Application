
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chore Dashboard | Chorify</title>

    <!-- Bootstrap CSS -->
     <!--sidebar menu, sandwhich on top right, menu opens from the left-->
     <!--when in "mobile view" nav is presented as a sandwhich, in desktop view it's straight across-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .app-main {
            flex: 1;
            min-width: 0;
        }

        .app-sidebar.offcanvas {
            position: relative;
            inset: auto;
            z-index: auto;
            width: 0;
            max-width: 80vw;
            height: auto;
            flex: 0 0 0;
            visibility: visible;
            transform: none;
            overflow: hidden;
            background-color: var(--bs-body-bg);
            transition: width 0.2s ease-in-out, flex-basis 0.2s ease-in-out;
        }

        .app-sidebar.offcanvas.show {
            width: 280px;
            flex-basis: 280px;
            border-right: 1px solid var(--bs-border-color);
        }

        .app-sidebar .offcanvas-body {
            min-width: 280px;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="offcanvas offcanvas-start app-sidebar" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel" data-bs-backdrop="false" data-bs-scroll="true">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="navbarNavLabel">Main Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="household.html">Household</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="myChores.html">My Chores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="myPoints.html">My Points</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="myProfile.html">My Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="settings.html">Settings</a>
                </li>
                </ul>
            </div>
        </div>

        <div class="app-main">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Chorify</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-label="Open navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
<!--navigation menu buttons-->
                    <div class="collapse navbar-collapse" id="navbarLinks">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link active" href="create-dashboard.html" aria-current="page">Create (+)</a></li>
                            <li class="nav-item"><a class="nav-link active" href="household.html">My Household</a></li>
                            <li class="nav-item"><a class="nav-link active" href="myChores.html">My Chores</a></li>
                            <li class="nav-item"><a class="nav-link active" href="myPoints.html">My Points</a></li>
                            <li class="nav-item"><a class="nav-link active" href="myProfile.html">My Profile</a></li>
                            <li class="nav-item"><a class="nav-link active" href="settings.html">Settings</a></li>
                        </ul>
                    </div>
                </div>
            </nav>

<!--more chore & household configuration-->
    <div class="container mt-4">

        
        <h2 class="mb-3">Dashboard</h2>

        <div class="card shadow-sm mb-3">
            <div class="card-body">

                <h4 class="fw-bold">Chorify</h4>

                <div>
                    <div>
                        <p class="mb-0">Username</p>
                        <p class="mb-0">Household</p>
                    </div>

                    <div>
                        <button class="btn btn-outline-secondary btn-sm">
                            Change household
                        </button>
<!--sign out but now leads to login.html be careful because you cannot get back in lol-->
                        <a class="btn btn-outline-secondary btn-sm" href="login.html">
                            Sign out
                        </a>
                    </div>
                </div>

            </div>
        </div>

     
<div class="mt-4">

    <h2>Tasks</h2>

    <button class="btn btn-outline-dark w-100 mb-3">
        + Create task
    </button>

    <!-- Task tabs -->
    <div class="d-flex gap-2 mb-3">
        <button class="btn btn-dark">All tasks</button>
        <button class="btn btn-outline-secondary">My tasks</button>
        <button class="btn btn-outline-secondary">Completed</button>
    </div>

    <!-- Search -->
    <input
        type="text"
        class="form-control mb-2"
        placeholder="Search tasks..."
    >

    <!-- Filters -->
    <select class="form-select mb-2">
        <option>Status: All</option>
        <option>To do</option>
        <option>In progress</option>
        <option>Done</option>
    </select>

    <select class="form-select mb-2">
        <option>Assignee: Anyone</option>
    </select>

    <select class="form-select mb-2">
        <option>Sort: Due date</option>
        <option>Sort: Points</option>
        <option>Sort: Task name</option>
    </select>

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
