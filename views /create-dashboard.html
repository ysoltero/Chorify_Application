
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chore Dashboard | Chorify</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        
        <h2 class="mb-3">Dashboard</h2>

        <div class="card shadow-sm mb-3">
            <div class="card-body">

                <h4 class="fw-bold">Chorify</h4>

                <div>
                    <div>
                        <p class="mb-0">Username</p>
                        <p class="mb-0">Household</p>
                    </div>

                    <div>
                        <button class="btn btn-outline-secondary btn-sm">
                            Change household
                        </button>

                        <button class="btn btn-outline-secondary btn-sm">
                            Sign out
                        </button>
                    </div>
                </div>

            </div>
        </div>


     
<div class="mt-4">

    <h2>Tasks</h2>

    <button class="btn btn-outline-dark w-100 mb-3">
        + Create task
    </button>

    <!-- Task tabs -->
    <div class="d-flex gap-2 mb-3">
        <button class="btn btn-dark">All tasks</button>
        <button class="btn btn-outline-secondary">My tasks</button>
        <button class="btn btn-outline-secondary">Completed</button>
    </div>

    <!-- Search -->
    <input
        type="text"
        class="form-control mb-2"
        placeholder="Search tasks..."
    >

    <!-- Filters -->
    <select class="form-select mb-2">
        <option>Status: All</option>
        <option>To do</option>
        <option>In progress</option>
        <option>Done</option>
    </select>

    <select class="form-select mb-2">
        <option>Assignee: Anyone</option>
    </select>

    <select class="form-select mb-2">
        <option>Sort: Due date</option>
        <option>Sort: Points</option>
        <option>Sort: Task name</option>
    </select>

</div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
