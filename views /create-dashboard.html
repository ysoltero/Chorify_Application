
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chore Dashboard | Chorify</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        
        <h2 class="mb-3">Tasks and scoreboard</h2>

        <div class="card shadow-sm mb-3">
            <div class="card-body">

                <h4 class="fw-bold">Chorify</h4>

                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="mb-0">Username</p>
                        <p class="mb-0">Household</p>
                    </div>

                    <div>
                        <button class="btn btn-outline-secondary btn-sm">
                            Change household
                        </button>

                        <button class="btn btn-outline-secondary btn-sm">
                            Sign out
                        </button>
                    </div>
                </div>

            </div>
        </div>


        <div class="row mt-4">

            <div class="col-12">
                <h3>Household Chores</h3>
                <p>Your household's assigned chores will appear here.</p>
            </div>

            <div class="col-md-6 col-lg-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">No chores yet</h5>
                        <p class="card-text">
                            Chores posted by your household will appear here.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
